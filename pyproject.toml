[project]
name = "pathology-oversight-eval"
version = "0.1.0"
description = "Pilot eval: how well Claude detects planted errors in synthetic histopathology and CBC reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
]

[project.scripts]
pathqc-eval = "pathqc_eval.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathqc_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
